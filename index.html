<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitácora Sebastián Mérida</title>
    <link rel="icon" href="recursos/img/LCB.png" type="image/png">
    <style>
        /*CSS-es un lenguaje de programacion(Diseñar en cascada)*/
        html, body{
            height: 100%;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        body{
            display: flex;
            flex-direction: column;
            text-align: center;
        }
        header{
            padding: 20px;
            background-color: orange;
            color: antiquewhite;
            }
        main{
            flex: 1;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
            background-color: aliceblue;
        }
        footer{
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border-top: 1px solid orange;
            background-color: cornsilk;
        }
        @media(max-width: 600px){
            footer{
                flex-direction: column;
                gap: 15px;
                padding: 20px;
            }
        }
        main h1{
            color: white;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 
                0 0 5px white
                0 0 10px antiquewhite
                0 0 20px rgb(252, 222, 184)
            ;
        }
    </style>
</head>
<body>
    <header>
        <h1>Bitácora segunda y tercera Unidad</h1>
    </header>
    <main>
        <h4>Contenido de la pagina WEB</h4>
    </main>
    <footer>
        <samp>@meridass_</samp>
        <img src="https://www.capouilliez.edu.gt/assets/img/logo.png" height="50" width="200">
    </footer>
</body>
</html>
